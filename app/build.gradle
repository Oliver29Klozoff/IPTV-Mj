import java.security.KeyStore
import java.security.MessageDigest
import java.security.UnrecoverableKeyException

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def mktvLocalProps = new Properties()
def mktvLocalPropsFile = rootProject.file("local.properties")
if (mktvLocalPropsFile.exists()) {
    mktvLocalPropsFile.withInputStream { mktvLocalProps.load(it) }
}

String mktvNormalizeSha256(String raw) {
    return raw == null ? "" : raw.replace(":", "").replace(" ", "").trim().toLowerCase()
}

String mktvReleaseCertSha256(File store, String storePass, String alias, String keyPass) {
    KeyStore ks = null
    Exception last = null
    for (String type : ["PKCS12", "JKS"]) {
        try {
            KeyStore candidate = KeyStore.getInstance(type)
            store.withInputStream { input -> candidate.load(input, storePass.toCharArray()) }
            ks = candidate
            break
        } catch (Exception e) {
            last = e
        }
    }
    if (ks == null) {
        throw last == null ? new IOException("keystore") : last
    }
    if (!ks.containsAlias(alias)) {
        throw new IllegalArgumentException("alias")
    }
    try {
        if (ks.getKey(alias, keyPass.toCharArray()) == null) {
            throw new IllegalArgumentException("key")
        }
    } catch (UnrecoverableKeyException e) {
        throw e
    }
    byte[] digest = MessageDigest.getInstance("SHA-256").digest(ks.getCertificate(alias).getEncoded())
    StringBuilder out = new StringBuilder()
    for (byte b : digest) {
        out.append(String.format("%02x", b & 0xff))
    }
    return out.toString()
}

def mktvBlank(value) {
    return value == null || value.toString().trim().isEmpty()
}

def mktvExpectedSigner = mktvNormalizeSha256(rootProject.file("release/expected-signer.sha256").exists()
        ? rootProject.file("release/expected-signer.sha256").getText("UTF-8")
        : "")
def mktvStorePath = mktvBlank(mktvLocalProps["RELEASE_STORE_FILE"]) ? "" : mktvLocalProps["RELEASE_STORE_FILE"].toString().trim()
def mktvStorePassword = mktvLocalProps["RELEASE_STORE_PASSWORD"]
def mktvKeyAlias = mktvBlank(mktvLocalProps["RELEASE_KEY_ALIAS"]) ? "" : mktvLocalProps["RELEASE_KEY_ALIAS"].toString().trim()
def mktvKeyPassword = mktvLocalProps["RELEASE_KEY_PASSWORD"]
ext.mktvReleaseSigningError = null
ext.mktvReleaseSignerSha256 = null
if (mktvBlank(mktvStorePath) || mktvBlank(mktvStorePassword) || mktvBlank(mktvKeyAlias) || mktvBlank(mktvKeyPassword) || mktvBlank(mktvExpectedSigner)) {
    ext.mktvReleaseSigningError = "Release signing configuration is missing. Refusing to build a production APK."
} else {
    def mktvStore = file(mktvStorePath)
    if (!mktvStore.isFile() || !mktvStore.canRead()) {
        ext.mktvReleaseSigningError = "Release keystore was not found. Refusing to build a production APK."
    } else {
        try {
            def actualSigner = mktvReleaseCertSha256(mktvStore, mktvStorePassword.toString(), mktvKeyAlias, mktvKeyPassword.toString())
            ext.mktvReleaseSignerSha256 = actualSigner
            if (actualSigner != mktvExpectedSigner) {
                ext.mktvReleaseSigningError = "Release keystore certificate does not match the expected production signer. Refusing to build a production APK."
            }
        } catch (UnrecoverableKeyException ignored) {
            ext.mktvReleaseSigningError = "Release signing password is invalid. Refusing to build a production APK."
        } catch (IllegalArgumentException ignored) {
            ext.mktvReleaseSigningError = "Release signing alias is invalid. Refusing to build a production APK."
        } catch (Exception ignored) {
            ext.mktvReleaseSigningError = "Release signing password is invalid. Refusing to build a production APK."
        }
    }
}

android {
    namespace 'com.iptvapp'
    // Media3 1.11.1 AARs refuse to build below compileSdk 36. targetSdk stays 35.
    compileSdk 36

    defaultConfig {
        applicationId "com.iptvapp"
        minSdk 25
        targetSdk 35
        versionCode 602
        versionName "7.64"

        // Trakt.tv API app — create one free at https://trakt.tv/oauth/applications
        // (any redirect_uri works, e.g. urn:ietf:wg:oauth:2.0:oob; the device-code flow used
        // here doesn't redirect). client_id is not sensitive and is embedded directly, but
        // client_secret is NEVER embedded in the app — it lives only in the Cloudflare Worker
        // proxy (see cloudflare/trakt-proxy-worker.js) so it can't be extracted from the APK.
        buildConfigField "String", "TRAKT_CLIENT_ID", "\"${mktvLocalProps['TRAKT_CLIENT_ID'] ?: ''}\""
        buildConfigField "String", "TRAKT_PROXY_URL", "\"${mktvLocalProps['TRAKT_PROXY_URL'] ?: ''}\""
        // Cast-to-device needs no configuration at all any more: nothing is proxied, and the
        // stream URL is sealed to a one-time key that the receiver shows in its QR code (see
        // CastRelayManager / CastBox). The old CAST_PROXY_URL / CAST_APP_KEY entries in
        // local.properties are now unused and can be deleted.
    }
    signingConfigs {
        release {
            if (project.ext.mktvReleaseSigningError == null) {
                storeFile file(mktvStorePath)
                storePassword mktvStorePassword
                keyAlias mktvKeyAlias
                keyPassword mktvKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
    buildTypes {
        debug {
            // Use the production certificate only when it actually matches. A missing
            // or wrong keystore must not stop a debug build, and must not be used for it.
            if (project.ext.mktvReleaseSigningError == null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            // The published APK hash is stored in the same commit that produced the APK.
            // Embedding that commit id would make the hash depend on itself.
            vcsInfo {
                include false
            }
            if (project.ext.mktvReleaseSigningError == null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Room writes one schema JSON per database version. The v43 file is the baseline the
    // migration test starts from; later compiles add the next version beside it.
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    // Host-side tests that run Android-facing classes (IptvCastProxyServerTest) get inert stubs for
    // android.* calls such as Log, rather than "not mocked" errors.
    testOptions {
        unitTests.returnDefaultValues = true
        // Migration tests read the exported Room schema from assets.
        unitTests.includeAndroidResources = true
    }

    // Room migration tests read the exported schema through the debug asset merge.
    // Unit tests on this project see debug assets, not the test source set. Release
    // does not include this directory.
    sourceSets {
        debug {
            assets.srcDir "$projectDir/schemas"
        }
    }

}

// The in-app "What's New" viewer reads CHANGELOG.md from assets, but the changelog is
// maintained at the project root (that's also what's used for GitHub release notes).
// Auto-copy it into assets on every build so the two can never drift out of sync again —
// this had silently been broken with no assets/ folder at all until this was added.
tasks.register("syncChangelogToAssets", Copy) {
    from(rootProject.file("CHANGELOG.md"))
    into("src/main/assets")
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("syncChangelogToAssets")
}

// Every release task depends on this. It is never up to date, so a missing or
// wrong keystore cannot reuse a previously signed APK.
tasks.register("verifyReleaseSigning") {
    outputs.upToDateWhen { false }
    doLast {
        if (project.ext.mktvReleaseSigningError != null) {
            def outDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
            if (outDir.isDirectory()) {
                outDir.eachFile { candidate ->
                    if (candidate.name.endsWith(".apk")) {
                        candidate.delete()
                    }
                }
            }
            throw new GradleException(project.ext.mktvReleaseSigningError)
        }
        println "Release signer SHA-256: ${project.ext.mktvReleaseSignerSha256}"
    }
}
tasks.configureEach { task ->
    if (task.name != "verifyReleaseSigning" && task.name.toLowerCase().contains("release")) {
        task.dependsOn("verifyReleaseSigning")
    }
}

